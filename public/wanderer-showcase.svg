<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Sky & Fog Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bdd1e3"/>
      <stop offset="60%" stop-color="#cadbe8"/>
      <stop offset="100%" stop-color="#e3ecf3"/>
    </linearGradient>

    <linearGradient id="mistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#cadbe8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8faec7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#cadbe8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Embedded Fonts Styling & Animations -->
    <style>
      @keyframes carouselPan {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-420px); }
        100% { transform: translateX(0px); }
      }
      @keyframes floatMist {
        0%, 100% { transform: translateX(0px) translateY(0px); opacity: 0.6; }
        50% { transform: translateX(25px) translateY(-8px); opacity: 0.9; }
      }
      @keyframes pulseBadge {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.03); }
      }
      .pan-track {
        animation: carouselPan 18s ease-in-out infinite;
      }
      .mist-layer {
        animation: floatMist 9s ease-in-out infinite;
      }
      .badge-pulse {
        animation: pulseBadge 3s ease-in-out infinite;
      }
      .title-text {
        font-family: 'Times New Roman', Georgia, serif;
        font-weight: 700;
        fill: #111111;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        fill: #333333;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1000" height="480" fill="url(#skyGrad)"/>

  <!-- Distant Mountain Peaks (Friedrich Wanderer horizon) -->
  <path d="M 0 320 Q 180 240 320 280 T 650 250 T 1000 290 L 1000 480 L 0 480 Z" fill="url(#mountainGrad)"/>
  <path d="M 0 340 Q 240 270 480 320 T 820 280 T 1000 330 L 1000 480 L 0 480 Z" fill="#b0c8dc" opacity="0.35"/>

  <!-- Flowing Mist Layers -->
  <g class="mist-layer">
    <ellipse cx="250" cy="360" rx="320" ry="40" fill="url(#mistGrad)"/>
    <ellipse cx="750" cy="350" rx="340" ry="45" fill="url(#mistGrad)"/>
  </g>

  <!-- 3D Cylindrical Cards Carousel Track (Animated) -->
  <g class="pan-track">
    <!-- Card 1: Angular Gulp Seed (AUG 2016) -->
    <g transform="translate(60, 90)">
      <rect x="0" y="0" width="180" height="85" rx="2" fill="url(#cardBg)" stroke="#777" stroke-width="1.2" stroke-dasharray="6,4"/>
      <rect x="15" y="-14" width="70" height="18" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <text x="50" y="-1" text-anchor="middle" class="sub-text" font-size="9">AUG 2016</text>
      <text x="15" y="48" class="title-text" font-size="20">Angular Gulp</text>
    </g>
    <!-- Card 2: State.js (JUL 2020) -->
    <g transform="translate(60, 205)">
      <rect x="0" y="0" width="180" height="85" rx="2" fill="url(#cardBg)" stroke="#777" stroke-width="1.2" stroke-dasharray="6,4"/>
      <rect x="15" y="85" width="65" height="18" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <text x="47" y="98" text-anchor="middle" class="sub-text" font-size="9">JUL 2020</text>
      <text x="15" y="48" class="title-text" font-size="22">State.js</text>
    </g>

    <!-- Card 3: change-host (JUL 2020) -->
    <g transform="translate(265, 80)">
      <rect x="0" y="0" width="185" height="85" rx="2" fill="url(#cardBg)" stroke="#777" stroke-width="1.2" stroke-dasharray="6,4"/>
      <rect x="15" y="-14" width="70" height="18" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <text x="50" y="-1" text-anchor="middle" class="sub-text" font-size="9">JUL 2020</text>
      <text x="15" y="48" class="title-text" font-size="22">change-host</text>
    </g>
    <!-- Card 4: Vaccine Slots (MAY 2021) -->
    <g transform="translate(265, 200)">
      <rect x="0" y="0" width="185" height="85" rx="2" fill="url(#cardBg)" stroke="#777" stroke-width="1.2" stroke-dasharray="6,4"/>
      <rect x="15" y="85" width="70" height="18" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <text x="50" y="98" text-anchor="middle" class="sub-text" font-size="9">MAY 2021</text>
      <text x="15" y="42" class="title-text" font-size="18">Vaccine Slots</text>
    </g>

    <!-- Card 5: Chat bot (AUG 2024) -->
    <g transform="translate(475, 75)">
      <rect x="0" y="0" width="185" height="85" rx="2" fill="url(#cardBg)" stroke="#777" stroke-width="1.2" stroke-dasharray="6,4"/>
      <rect x="15" y="-14" width="72" height="18" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <text x="51" y="-1" text-anchor="middle" class="sub-text" font-size="9">AUG 2024</text>
      <text x="15" y="48" class="title-text" font-size="22">Chat bot</text>
    </g>
    <!-- Card 6: Word Game (OCT 2024) -->
    <g transform="translate(475, 195)">
      <rect x="0" y="0" width="185" height="85" rx="2" fill="url(#cardBg)" stroke="#777" stroke-width="1.2" stroke-dasharray="6,4"/>
      <rect x="15" y="85" width="72" height="18" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <text x="51" y="98" text-anchor="middle" class="sub-text" font-size="9">OCT 2024</text>
      <text x="15" y="48" class="title-text" font-size="21">Word Game</text>
    </g>

    <!-- Card 7: DJ Gig (FEATURED - MAR 2025) -->
    <g transform="translate(685, 70)">
      <rect x="0" y="0" width="190" height="90" rx="3" fill="#ffffff" fill-opacity="0.85" stroke="#000000" stroke-width="2.5"/>
      <rect x="15" y="-14" width="72" height="18" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <text x="51" y="-1" text-anchor="middle" class="sub-text" font-size="9">MAR 2025</text>
      <text x="18" y="52" class="title-text" font-size="26">DJ Gig ★</text>
    </g>
    <!-- Card 8: Portfolio (APR 2025) -->
    <g transform="translate(685, 195)">
      <rect x="0" y="0" width="190" height="85" rx="2" fill="url(#cardBg)" stroke="#777" stroke-width="1.2" stroke-dasharray="6,4"/>
      <rect x="15" y="85" width="72" height="18" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <text x="51" y="98" text-anchor="middle" class="sub-text" font-size="9">APR 2025</text>
      <text x="18" y="48" class="title-text" font-size="22">Portfolio</text>
    </g>

    <!-- Card 9: Focus Clock (JUN 2025) -->
    <g transform="translate(900, 75)">
      <rect x="0" y="0" width="185" height="85" rx="2" fill="url(#cardBg)" stroke="#777" stroke-width="1.2" stroke-dasharray="6,4"/>
      <rect x="15" y="-14" width="72" height="18" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <text x="51" y="-1" text-anchor="middle" class="sub-text" font-size="9">JUN 2025</text>
      <text x="15" y="48" class="title-text" font-size="21">Focus Clock</text>
    </g>
    <!-- Card 10: Slide Sync (OCT 2025) -->
    <g transform="translate(900, 195)">
      <rect x="0" y="0" width="185" height="85" rx="2" fill="url(#cardBg)" stroke="#777" stroke-width="1.2" stroke-dasharray="6,4"/>
      <rect x="15" y="85" width="72" height="18" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <text x="51" y="98" text-anchor="middle" class="sub-text" font-size="9">OCT 2025</text>
      <text x="15" y="48" class="title-text" font-size="21">Slide Sync</text>
    </g>

    <!-- Card 11: Reso (MAY 2026) -->
    <g transform="translate(1110, 80)">
      <rect x="0" y="0" width="185" height="85" rx="2" fill="url(#cardBg)" stroke="#777" stroke-width="1.2" stroke-dasharray="6,4"/>
      <rect x="15" y="-14" width="72" height="18" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <text x="51" y="-1" text-anchor="middle" class="sub-text" font-size="9">MAY 2026</text>
      <text x="15" y="48" class="title-text" font-size="24">Reso</text>
    </g>
    <!-- Card 12: Present (FEATURED - JUN 2026) -->
    <g transform="translate(1110, 200)">
      <rect x="0" y="0" width="185" height="90" rx="3" fill="#ffffff" fill-opacity="0.85" stroke="#000000" stroke-width="2.5"/>
      <rect x="15" y="90" width="72" height="18" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <text x="51" y="103" text-anchor="middle" class="sub-text" font-size="9">JUN 2026</text>
      <text x="15" y="50" class="title-text" font-size="24">Present ★</text>
    </g>

    <!-- Card 13: Splittle (AUG 2026) -->
    <g transform="translate(1320, 85)">
      <rect x="0" y="0" width="185" height="85" rx="2" fill="url(#cardBg)" stroke="#777" stroke-width="1.2" stroke-dasharray="6,4"/>
      <rect x="15" y="-14" width="72" height="18" fill="#ffffff" stroke="#000" stroke-width="1"/>
      <text x="51" y="-1" text-anchor="middle" class="sub-text" font-size="9">AUG 2026</text>
      <text x="15" y="48" class="title-text" font-size="24">Splittle</text>
    </g>
  </g>

  <!-- Foreground: Rocky Crag (Caspar David Friedrich Rock) -->
  <g transform="translate(500, 370)">
    <!-- Main Peak Rocks -->
    <polygon points="-120,110 -80,50 -35,10 0,-15 35,10 80,50 120,110 0,110" fill="#2c221a"/>
    <polygon points="-90,110 -60,65 -20,25 0,-15 15,30 45,75 90,110" fill="#3d3025"/>
    <polygon points="-50,110 -25,50 0,-15 20,40 50,110" fill="#4d3e30"/>
    <polygon points="-15,110 -5,60 0,-15 10,70 15,110" fill="#5c4b3a"/>

    <!-- Wanderer Character -->
    <g transform="translate(0, -15)">
      <!-- Boots -->
      <path d="M -12 0 L -6 -25 L -3 -25 L -8 0 Z" fill="#151515"/>
      <path d="M 4 0 L 8 -25 L 12 -25 L 10 0 Z" fill="#1a1a1a"/>
      <!-- Trousers -->
      <path d="M -8 -25 L -5 -60 L 5 -60 L 8 -25 Z" fill="#1b2820"/>
      <!-- Dark Green Frock Coat (Wanderer's Coat) -->
      <path d="M -16 -60 Q -24 -95 -14 -120 Q 0 -130 14 -120 Q 24 -95 16 -60 Q 6 -45 -16 -60 Z" fill="#1e3427"/>
      <!-- Arms & Folds -->
      <path d="M -16 -115 L -26 -85 L -20 -80 L -12 -110 Z" fill="#182b20"/>
      <path d="M 16 -115 L 24 -85 L 18 -80 L 12 -110 Z" fill="#16261d"/>
      <!-- Hair (Reddish-Auburn / Blond) -->
      <ellipse cx="0" cy="-126" rx="9" ry="11" fill="#b8834c"/>
      <path d="M -8 -130 Q 0 -140 8 -130 Q 6 -120 0 -122 Q -6 -120 -8 -130 Z" fill="#9e6d38"/>
      <!-- Walking Stick / Cane -->
      <line x1="22" y1="-80" x2="28" y2="10" stroke="#151515" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Interactive 3D Badge (Pulsing Center Pill) -->
  <g transform="translate(500, 440)" class="badge-pulse">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#000000" fill-opacity="0.8" stroke="#ffffff" stroke-width="1.2"/>
    <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">
      EXPLORE 3D SHOWCASE ↗
    </text>
  </g>
</svg>
